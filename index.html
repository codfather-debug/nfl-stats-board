<!doctype html>
<html lang="en">
<meta charset="utf-8">
<title>NFL Stat Board</title>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700&family=Source+Sans+3:wght@400;600;700&display=swap">
<style>
/* A game-day call sheet: a band of tabs, then dense rows. Same look as the TD Board. */
:root {
  --bg: #eef1f4; --surface: #ffffff; --sunken: #e1e6ec; --fg: #14202b; --muted: #566573; --line: #ccd5de;
  --accent: #1d4f91; --accent-fg: #ffffff; --band: #13263d; --band-fg: #eaf0f7; --band-muted: #a7b9cc;
  --rb: #b5461f; --wr: #1c62a8; --te: #7a3f9d; --qb: #8a6a00;
  --good: #16764d; --bad: #b3362b; --warn: #a86a00;
  --display: "Barlow Condensed", "Arial Narrow", sans-serif;
  --body: "Source Sans 3", system-ui, sans-serif;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --bg: #0f1620; --surface: #17212d; --sunken: #0b1118; --fg: #e6edf4; --muted: #9daebf; --line: #2b3a4a;
  --accent: #7fb2f0; --accent-fg: #0a1420; --band: #0a1624; --band-fg: #e6edf4; --band-muted: #8ea4bb;
  --rb: #f08a5d; --wr: #6db1f0; --te: #c592e6; --qb: #e0bd4f;
  --good: #5fcb9b; --bad: #f0827a; --warn: #f0b84a; color-scheme: dark;
} }
:root[data-theme="dark"] {
  --bg: #0f1620; --surface: #17212d; --sunken: #0b1118; --fg: #e6edf4; --muted: #9daebf; --line: #2b3a4a;
  --accent: #7fb2f0; --accent-fg: #0a1420; --band: #0a1624; --band-fg: #e6edf4; --band-muted: #8ea4bb;
  --rb: #f08a5d; --wr: #6db1f0; --te: #c592e6; --qb: #e0bd4f;
  --good: #5fcb9b; --bad: #f0827a; --warn: #f0b84a; color-scheme: dark;
}
* { box-sizing: border-box; }
body { background: var(--bg); color: var(--fg); font: 15px/1.4 var(--body); margin: 0; font-variant-numeric: tabular-nums; }
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 10; background: var(--band); }
.gutter { padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
.wrap { max-width: 1120px; margin: 0 auto; }
header.top { background: var(--band); color: var(--band-fg); padding-block: calc(16px + env(safe-area-inset-top, 0px)) 0; }
.brand { display: flex; flex-wrap: wrap; align-items: baseline; gap: 4px 14px; }
h1 { font: 700 34px/1 var(--display); letter-spacing: .01em; margin: 0; text-transform: uppercase; }
.brand small { color: var(--band-muted); font-size: 13px; }
.updater { margin-left: auto; display: flex; flex-wrap: wrap; align-items: center; justify-content: flex-end; gap: 4px 10px; }
#update-status { color: var(--band-muted); font-size: 13px; }
#update-btn { background: var(--band-fg); color: var(--band); border: 0; border-radius: 5px; cursor: pointer; font: 700 15px/1 var(--display); letter-spacing: .03em; padding: 8px 11px; text-transform: uppercase; white-space: nowrap; }
#update-btn:disabled { cursor: wait; opacity: .6; }
nav.tabs { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 5; background: var(--band); }
.tabrow { display: flex; gap: 2px; overflow-x: auto; padding-top: 8px; }
.tabrow button { flex: none; background: none; border: 0; color: var(--band-muted); cursor: pointer; font: 600 18px/1 var(--display); letter-spacing: .03em; padding: 10px 14px 11px; text-transform: uppercase; border-radius: 4px 4px 0 0; }
.tabrow button:hover { color: var(--band-fg); }
.tabrow button[aria-selected="true"] { background: var(--bg); color: var(--fg); }
main { padding-block: 20px 48px; }
h2 { font: 700 24px/1.1 var(--display); letter-spacing: .02em; margin: 0; text-transform: uppercase; }
h3 { font: 600 18px/1.1 var(--display); letter-spacing: .03em; margin: 0; text-transform: uppercase; }
.stack { display: flex; flex-direction: column; gap: 18px; }
.hint { color: var(--muted); font-size: 13.5px; max-width: 75ch; margin: 4px 0 0; }
button, select { font: inherit; color: inherit; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.filters { display: flex; flex-wrap: wrap; gap: 8px 12px; align-items: center; }
.seg { display: inline-flex; flex-wrap: wrap; border: 1px solid var(--line); border-radius: 6px; overflow: hidden; background: var(--surface); }
.seg button { background: none; border: 0; border-right: 1px solid var(--line); cursor: pointer; padding: 6px 11px; font-size: 14px; font-weight: 600; color: var(--muted); }
.seg button:last-child { border-right: 0; }
.seg button[aria-pressed="true"] { background: var(--accent); color: var(--accent-fg); }
select { background: var(--surface); border: 1px solid var(--line); border-radius: 6px; padding: 5px 9px; max-width: 100%; }
.count { color: var(--muted); font-size: 13.5px; }
.chip { display: inline-block; font: 700 14px/1 var(--display); letter-spacing: .04em; color: var(--c); border: 1.5px solid var(--c); border-radius: 4px; padding: 3px 5px 2px; }
.RB { --c: var(--rb); } .WR { --c: var(--wr); } .TE { --c: var(--te); } .QB { --c: var(--qb); }
.flag { display: inline-block; font: 600 12px/1 var(--body); color: var(--warn); border: 1px solid currentColor; border-radius: 3px; padding: 2px 4px; margin-left: 4px; vertical-align: middle; }
.flag.bad { color: var(--bad); }

.cards { display: grid; grid-template-columns: repeat(auto-fill, minmax(250px, 1fr)); gap: 10px; }
.card { background: var(--surface); border: 1px solid var(--line); border-radius: 6px; padding: 10px 12px; display: grid; gap: 5px; }
.card .l1 { display: flex; justify-content: space-between; align-items: center; gap: 8px; color: var(--muted); font-size: 13.5px; }
.card .name { font: 600 21px/1.05 var(--display); }
.card .mile { display: flex; justify-content: space-between; align-items: baseline; gap: 8px; }
.card .mile span { font-weight: 600; }
.card .rate { font: 700 28px/1 var(--display); color: var(--good); }
.card .l3 { color: var(--muted); font-size: 13px; }
.card .l3 b { color: var(--fg); font-weight: 600; }
.meter { height: 6px; background: var(--sunken); border-radius: 3px; overflow: hidden; }
.meter i { display: block; height: 100%; background: var(--good); }
.day { display: flex; align-items: baseline; gap: 8px; margin: 6px 0 -6px; }
.day span { color: var(--muted); font-size: 13.5px; }

.tablebox { overflow-x: auto; background: var(--surface); border: 1px solid var(--line); border-radius: 6px; }
table.data { border-collapse: collapse; width: 100%; font-size: 14px; }
table.data th { background: var(--sunken); color: var(--muted); font-size: 12px; font-weight: 600; letter-spacing: .03em; padding: 7px 9px; text-align: right; white-space: nowrap; }
table.data td { padding: 6px 9px; border-top: 1px solid var(--line); text-align: right; white-space: nowrap; }
table.data .t { text-align: left; }
table.data td.who { font-weight: 600; white-space: normal; min-width: 150px; }
table.data td.who .count { font-weight: 400; font-size: 12.5px; }
td.r { font-weight: 700; }
td.r.h4 { color: var(--good); } td.r.h3 { color: color-mix(in srgb, var(--good) 75%, var(--fg)); } td.r.h1 { color: var(--muted); font-weight: 400; }
.hit { color: var(--good); font-weight: 700; } .miss { color: var(--bad); font-weight: 700; } .void { color: var(--muted); }
.grid2 { display: grid; grid-template-columns: repeat(auto-fit, minmax(min(100%, 340px), 1fr)); gap: 14px; }
.panel { background: var(--surface); border: 1px solid var(--line); border-radius: 6px; padding: 12px 14px; display: grid; gap: 10px; align-content: start; min-width: 0; }
.panel table.data th { background: none; padding: 3px 6px; } .panel table.data td { padding: 4px 6px; }
.notes { background: var(--surface); border: 1px solid var(--line); border-radius: 6px; padding: 4px 16px; }
.notes li { margin: 8px 0; max-width: 80ch; }
@media (max-width: 480px) { table.data th, table.data td { padding: 6px 5px; } table.data td.who { min-width: 118px; } table.data td.who .chip { display: none; } }
.tablebox table.data th:first-child, .tablebox table.data td:first-child { position: sticky; left: 0; z-index: 1; background: var(--surface); box-shadow: 1px 0 0 var(--line); }
.tablebox table.data th:first-child { background: var(--sunken); }
.soft { color: var(--good); font-weight: 700; } .tough { color: var(--bad); font-weight: 700; }
.card .mu { font-size: 13px; color: var(--muted); }
table.data th button { all: unset; cursor: pointer; } table.data th[aria-sort] { color: var(--fg); }
tr.mine td { background: color-mix(in srgb, var(--accent) 10%, transparent); }
details.log summary { cursor: pointer; color: var(--accent); font-size: 13px; font-weight: 600; }
details.log table.data { margin-top: 6px; font-size: 13px; } details.log table.data th, details.log table.data td { padding: 3px 5px; }
.hh { display: block; font-size: 11.5px; font-weight: 400; color: var(--muted); }
.more { justify-self: start; background: none; border: 0; padding: 0; color: var(--accent); cursor: pointer; font-weight: 600; text-decoration: underline; text-underline-offset: 2px; }
</style>

    const roster = {};
    for (const p of DATA.players) (roster[p.team] ||= []).push(p.key);
    let changed = 0;

    ${muLine(p, m)}
    ${roleLine(p, x.mk)}
    <div class="l3">${projText(p, x.mk)}${p.x.gp ? `Avg <b>${num(p.x[m.stat + "_g"])}</b> · last 3 <b>${num(p.x[m.stat + "_l3"])}</b> · ` : ""}${p.x.prev_gp ? `last season <b>${num(p.x["prev_" + m.stat])}</b> <span class="count">(${p.x.prev_gp}g)</span> · ` : ""}tier tested on ${t.n} games</div>
    ${splitLine(p, m, g)}
    ${gameLog(p, x.mk)}
  </div>`;
}

const PROJ_UNIT = { rush_yds: "rush yds", carries: "carries", rec_yds: "rec yds", receptions: "rec", scrimmage: "rush+rec yds",
  long_rush: "yd long rush", long_rec: "yd long catch", pass_yds: "pass yds", pass_tds: "pass TD", completions: "comp" };
const projText = (p, mk) => p.proj[mk] == null ? "" : `Projected <b>${num(p.proj[mk])}</b> ${PROJ_UNIT[mk]} · `;
// Home/away, indoors/outdoors and turf/grass averages from the game log.
const SPLIT_DEFS = [["home", "Home", "Away"], ["indoor", "Indoors", "Outdoors"], ["turf", "Turf", "Grass"]];
function splitAvg(p, stat, col, val) {
  const g = p.log.filter((r) => r[LOG[col]] === val);
  return { n: g.length, avg: g.length ? g.reduce((s, r) => s + logStat(r, stat), 0) / g.length : null };
}
function splitLine(p, m, g) {
  const parts = SPLIT_DEFS.map(([col, yes, no]) => {
    const here = g[col] ? 1 : 0, a = splitAvg(p, m.stat, col, here), b = splitAvg(p, m.stat, col, 1 - here);
    return `${here ? yes : no} <b>${num(a.avg)}</b> <span class="count">(${a.n}g)</span> vs ${(here ? no : yes).toLowerCase()} ${num(b.avg)} <span class="count">(${b.n}g)</span>`;
  });
  return `<div class="mu">Splits for this game: ${parts.join(" · ")}</div>`;
}
function histLine(p, m, line) {
  const h = history(p, m.stat, line);
  return `<div class="mu">Cleared in <b>${h.hits} of ${h.games}</b> games this season · last ${h.games5}: <b>${h.hits5}</b></div>`;
}
const RECEIVING = new Set(["rec_yds", "receptions", "long_rec"]), PASSING = new Set(["pass_yds", "pass_tds", "completions"]);
function trend(now, before) {
  const d = now - before;
  return Math.abs(d) < 0.03 ? "" : d > 0 ? ' <span class="soft">▲</span>' : ' <span class="tough">▼</span>';
}
function roleLine(p, mk) {
  if (PASSING.has(mk)) return "";
  const x = p.x, bits = [];
  const showT = RECEIVING.has(mk) || p.pos !== "RB" || mk === "td" || mk === "scrimmage";
  const showC = !RECEIVING.has(mk) && (p.pos === "RB" || p.pos === "QB");
  if (showC) bits.push(`Carry share <b>${pct(x.carries_sh)}</b> (last 3: ${pct(x.carries_sh3)}${trend(x.carries_sh3, x.carries_sh)})`);
  if (showT) bits.push(`Target share <b>${pct(x.targets_sh)}</b> (last 3: ${pct(x.targets_sh3)}${trend(x.targets_sh3, x.targets_sh)})`);
  if (mk === "td") bits.push(`Red zone <b>${num(x.rz_opp_g)}</b>/g · inside 10 <b>${num(x.i10_opp_g)}</b>/g · ${pct(x.rz_opp_sh)} of team RZ`);
  if (x.missed > 0) bits.push(`<span class="flag">Back</span> after missing ${x.missed} game${x.missed === 1 ? "" : "s"} · numbers are from before`);
  const vc = x.vac_carries || 0, vt = x.vac_targets || 0;
  if ((showC && vc >= 0.05) || (showT && vt >= 0.05))
    bits.push(`<span class="soft">Teammates out:</span> ${[showC && vc >= 0.05 ? `${pct(vc)} of carries` : "", showT && vt >= 0.05 ? `${pct(vt)} of targets` : ""].filter(Boolean).join(", ")} open up`);
  return bits.map((b) => `<div class="mu">${b}</div>`).join("");
}
const LOG_SHOW = { rush: ["carries", "rushing_yards", "long_rush", "rr_tds"], rec: ["targets", "receptions", "receiving_yards", "long_rec", "rr_tds"],
  pass: ["completions", "attempts", "passing_yards", "passing_tds"] };
const LOG_LABEL = { carries: "Car", rushing_yards: "Rush", long_rush: "Lng", rr_tds: "TD", targets: "Tgt", receptions: "Rec", receiving_yards: "Yds",
  long_rec: "Lng", completions: "Cmp", attempts: "Att", passing_yards: "Yds", passing_tds: "TD" };
function gameLog(p, mk) {
  const kind = PASSING.has(mk) ? "pass" : RECEIVING.has(mk) || (mk !== "rush_yds" && mk !== "carries" && mk !== "long_rush" && p.pos !== "RB" && p.pos !== "QB") ? "rec" : "rush";
  const cols = kind === "rush" && p.pos === "RB" && (mk === "scrimmage" || mk === "td") ? ["carries", "rushing_yards", "receptions", "receiving_yards", "rr_tds"] : LOG_SHOW[kind];
  const lbl = (c) => c === "receiving_yards" && cols.includes("rushing_yards") ? "Rec yds" : LOG_LABEL[c];
  return `<details class="log"><summary>Game log</summary><table class="data"><thead><tr><th class="t">Wk</th><th class="t">Opp</th>${cols.map((c) => `<th>${lbl(c)}</th>`).join("")}<th>Snap</th></tr></thead><tbody>
    ${[...p.log].reverse().map((r) => `<tr><td class="t">${r[LOG.week]}</td><td class="t">${r[LOG.home] ? "" : "@"}${esc(r[LOG.opp])}</td>${cols.map((c) => `<td>${num(r[LOG[c]], 0)}</td>`).join("")}<td>${pct(r[LOG.snap])}</td></tr>`).join("")}
  </tbody></table></details>`;
}
function muLine(p, m) {
  const u = matchup(p, m.stat);
  if (!u) return "";
  const g = gameOf(p.team), d = DEF[`${p.opp}|${p.pos}`], atHome = !g.home;
  const v = d[m.stat][atHome ? 3 : 4], n = atHome ? d.gamesHome : d.gamesRoad;
  const venue = v == null ? "" : ` · <b>${num(v)}</b> ${atHome ? "at home" : "on the road"} <span class="count">(${n}g)</span>`;
  return `<div class="mu">${esc(p.opp)} allows <b>${num(u.v)}</b> ${STAT_SHORT_COL[m.stat]}/g to ${p.pos}s (avg ${num(u.lg)}) · <span class="${rankClass(u.rank)}">${ord(u.rank)} most</span>${venue}</div>`;
}
const STAT_SHORT_COL = { rushing_yards: "rush yds", carries: "carries", receiving_yards: "rec yds", receptions: "rec", scrimmage_yards: "rush+rec yds",
  passing_yards: "pass yds", passing_tds: "pass TD", completions: "comp", rr_tds: "TDs" };

function viewStats() {
  const mk = state.market, m = MARKETS[mk], lines = Object.keys(m.lines).sort((a, b) => a - b);
  const games = [...new Map(DATA.slate.filter((g) => g.home).map((g) => [g.team, g])).values()];
  let rows = DATA.players.filter((p) => p.plays[`${mk}|${lines[0]}`] && (!state.game || [p.team, p.opp].includes(state.game)));
  rows.sort((a, b) => b.plays[`${mk}|${lines[0]}`].p - a.plays[`${mk}|${lines[0]}`].p);
  const shown = state.all ? rows : rows.slice(0, 40);
  const cls = (r) => r >= 0.8 ? "h4" : r >= 0.6 ? "h3" : r < 0.3 ? "h1" : "";
  return `<div class="stack">
    <div><h2>${esc(m.label)}</h2><p class="hint">Tested hit rate for each milestone, highest first. Avg is this season's per-game number in games played. Proj is the model's projected line for this game: the player should finish above it about half the time. Under each rate is how many games this season the player cleared it. After the matchup, the opponent's rank in that stat allowed to the player's position (1st = allows the most).</p></div>
    <div class="filters">${seg("market", Object.entries(MARKETS).map(([k, v]) => [k, v.label]), mk)}</div>
    <div class="filters"><select data-set="game" aria-label="Game"><option value="">All games</option>${games.map((g) => `<option value="${g.team}" ${state.game === g.team ? "selected" : ""}>${esc(g.opp)} @ ${esc(g.team)}</option>`).join("")}</select><span class="count">${rows.length} players</span></div>
    <div class="tablebox"><table class="data"><thead><tr><th class="t">Player</th><th>Avg</th><th>${m.proj ? "Proj" : "L3"}</th>${lines.map((l) => `<th>${mk === "td" ? "TD" : l + "+"}</th>`).join("")}</tr></thead><tbody>
    ${shown.map((p) => { const g = gameOf(p.team); return `<tr${started(p.team) || !available(p) ? ' style="opacity:.5"' : ""}><td class="t who"><span class="chip ${p.pos}">${p.pos}</span> ${esc(p.player)}${statusFlag(p.status)}<div class="count">${esc(p.team)} ${g.home ? "vs" : "@"} ${esc(p.opp)}${(() => { const u = matchup(p, m.stat); return u ? ` · ${esc(p.opp)} D <span class="${rankClass(u.rank)}">${ord(u.rank)}-most allowed</span>` : ""; })()}</div></td>
      <td>${num(p.x[m.stat + "_g"])}</td><td>${m.proj ? `<b>${num(p.proj[mk])}</b>` : num(p.x[m.stat + "_l3"])}</td>
      ${lines.map((l) => { const r = p.plays[`${mk}|${l}`].rate, h = history(p, m.stat, +l); return `<td class="r ${cls(r)}">${pct(r)}<span class="hh">${h.hits}/${h.games}</span></td>`; }).join("")}</tr>`; }).join("")}
    </tbody></table></div>
    ${rows.length > 40 ? `<button class="more" data-set="all" data-val="${!state.all}">${state.all ? "Show top 40" : `Show all ${rows.length}`}</button>` : ""}
  </div>`;
}

const BUCKETS = [[0.8, 1.01, "80%+"], [0.7, 0.8, "70–79%"], [0.6, 0.7, "60–69%"], [0.5, 0.6, "50–59%"]];
function summary(list) {
  const g = list.filter((e) => e.hit != null);
  const hits = g.filter((e) => e.hit).length;
  return { n: g.length, hits, rate: g.length ? hits / g.length : null, exp: g.length ? g.reduce((s, e) => s + e.rate, 0) / g.length : null };
}
function viewResults() {
  const all = DATA.results, graded = all.filter((e) => e.hit != null);
  const pending = all.filter((e) => !("actual" in e)).length, voids = all.filter((e) => "actual" in e && e.hit == null).length;
  const row = (label, list) => { const s = summary(list); return `<tr><td class="t">${label}</td><td>${s.n}</td><td>${s.hits}</td><td class="r">${pct(s.rate)}</td><td>${pct(s.exp)}</td></tr>`; };
  const head = `<thead><tr><th class="t"></th><th>Graded</th><th>Hits</th><th>Hit rate</th><th>Tested</th></tr></thead>`;
  const weeks = [...new Set(graded.map((e) => e.season * 100 + e.week))].sort((a, b) => b - a);
  const top = graded.filter((e) => e.rate >= 0.7).sort((a, b) => b.week - a.week || b.rate - a.rate);
  return `<div class="stack">
    <div><h2>Results</h2><p class="hint">Every play at a tested rate of 50% or more is recorded before kickoff and graded once the box score posts. "Tested" is the rate those plays were expected to hit. Players who don't take an offensive snap are voided. Tracking started with Week ${Math.min(...all.map((e) => e.week)) || DATA.week} of ${DATA.season}, so early weeks are a small sample.</p></div>
    <p class="count">${graded.length} graded · ${pending} waiting on games or box scores · ${voids} void</p>
    <div class="grid2">
      <div class="panel"><h3>By tested rate</h3><table class="data">${head}<tbody>${BUCKETS.map(([lo, hi, l]) => row(l, graded.filter((e) => e.rate >= lo && e.rate < hi))).join("")}${row("All", graded)}</tbody></table></div>
      <div class="panel"><h3>By stat</h3><table class="data">${head}<tbody>${Object.entries(MARKETS).map(([k, m]) => row(m.label, graded.filter((e) => e.market === k))).join("")}</tbody></table></div>
      <div class="panel"><h3>By week</h3><table class="data">${head}<tbody>${weeks.map((w) => row(`Week ${w % 100}`, graded.filter((e) => e.season * 100 + e.week === w))).join("") || '<tr><td class="t" colspan="5">No graded games yet.</td></tr>'}</tbody></table></div>
    </div>
    <h3>Graded 70%+ plays</h3>
    <div class="tablebox"><table class="data"><thead><tr><th class="t">Wk</th><th class="t">Player</th><th class="t">Milestone</th><th>Tested</th><th>Actual</th><th class="t">Result</th></tr></thead><tbody>
    ${top.map((e) => `<tr><td class="t">${e.week}</td><td class="t who">${esc(e.player)} <span class="count">${esc(e.team)}</span></td><td class="t">${mileLabel(e.market, e.line)}</td><td>${pct(e.rate)}</td><td>${num(e.actual, 0)}</td><td class="t ${e.hit ? "hit" : "miss"}">${e.hit ? "Hit" : "Miss"}</td></tr>`).join("") || '<tr><td class="t" colspan="6">None graded yet.</td></tr>'}
    </tbody></table></div>
  </div>`;
}

function viewDefense() {
  const pos = state.dpos, cols = DEF_COLS[pos], sort = cols.includes(state.dsort) ? state.dsort : cols[0];
  const rows = (DATA.defenses || []).filter((d) => d.pos === pos).sort((a, b) => a[sort][2] - b[sort][2]);
  const opp = Object.fromEntries(DATA.slate.map((g) => [g.opp, g.team]));
  return `<div class="stack">
    <div><h2>Defense vs. position</h2><p class="hint">Per game allowed to each position this season, through Week ${DATA.week - 1}. Ranks run from 1st (allows the most, the softest matchup) to 32nd. Green is a top-8 soft matchup and red is a bottom-8 tough one. Tap a column to sort. Rows for defenses facing a team this week show the opponent.</p></div>
    <div class="filters">${seg("dpos", ["QB", "RB", "WR", "TE"].map((p) => [p, p + "s"]), pos)}</div>
    <div class="tablebox"><table class="data"><thead><tr><th class="t">Defense</th><th class="t">Faces</th>${cols.map((c) => `<th${c === sort ? ' aria-sort="descending"' : ""}><button data-set="dsort" data-val="${c}">${COL_LABEL[c]}</button></th>`).join("")}</tr></thead><tbody>
    ${rows.map((d) => `<tr><td class="t who">${esc(d.team)} <span class="count">${d.games}g</span></td><td class="t">${opp[d.team] ? esc(opp[d.team]) : '<span class="count">bye</span>'}</td>${cols.map((c) => `<td>${num(d[c][0])} <span class="${rankClass(d[c][2]) || "count"}">${ord(d[c][2])}</span></td>`).join("")}</tr>`).join("")}
    </tbody></table></div>
    <p class="hint">League average per game: ${cols.map((c) => `${COL_LABEL[c]} ${num(rows[0]?.[c][1])}`).join(" · ")}.</p>
  </div>`;
}

function viewBacktest() {
  return `<div class="stack">
    <div><h2>How it was tested</h2><p class="hint">One logistic model per milestone, trained on ${MODEL.seasons[0]}–${MODEL.seasons[MODEL.seasons.length - 1]}. Inputs are the player's per-game average for the stat (blended with last season's, which counts like 3 games, so early weeks and players back from injury still have a baseline), last-3 average, volume (carries, targets or pass attempts) and share of team volume, snap share in the player's last game, games played this season and games missed since last playing. Rushing yards, rush attempts, passing yards and completions also use the opponent's allowed-per-game to the player's position, compared with the league average; passing yards and completions also use what the opponent allows at home or on the road, matching this game. Rushing, receiving, receptions, rush + rec and longest catch also use the share of team carries or targets held by teammates who are out. Anytime TD uses red zone and inside-10 touches and shares. Longest rush and longest catch come from play-by-play. Only games before the one being predicted count. Each season from 2022 on is graded by a model trained only on the seasons before it, starting from 2020, so every rate comes from games the model never saw. Inputs were chosen on 2022–24, so the 2025–26 column is the cleanest check. Tiers with fewer than ${40} games are merged with the tier below. Each stat also has a projected line: a median model on the same inputs, so the player should finish above it about half the time.</p></div>
    <ul class="notes">
      <li><b>Raw model output runs high.</b> In the top tier the model's own probability ran several points above what actually happened, mostly for receiving stats. So the board shows tested tier rates, not raw output.</li>
      <li><b>Sample size.</b> Each held-out tier rests on 40 to over a thousand games. QB stats rest on ${MARKETS.pass_yds.lines["225"].heldOut.n} QB-games, so their tiers carry more noise (roughly ±7 points at 150 games).</li>
      <li><b>Chosen after seeing data.</b> The milestones, tier edges and inputs were picked while looking at past seasons. New inputs were chosen on 2022–24 only, so the 2025–26 column is the fairest check; the forward Results page is the honest one.</li>
      <li><b>Player stats only.</b> Projected team points and the spread are left out on purpose. Without them, the best held-out tier for RB, WR and TE stats dropped 1 to 3 points. For passing yards and passing TDs it dropped about 10 points, so QB plays are weaker than they could be.</li>
      <li><b>Splits.</b> Home vs. away, indoors vs. outdoors and turf vs. grass are shown on each card. In testing, adding a player's own splits didn't improve any stat (each split rests on just a few games), so the models don't use them.</li>
      <li><b>Players.</b> A player needs ${MODEL.minGames}+ games this season or ${MODEL.minPrevGames}+ last season, and must be on nflverse's active roster (IR and practice squad are left off). A traded player shows with the new team using numbers from the old one. A backup QB stepping in has little to go on, and receivers aren't adjusted when their starting QB is out.</li>
      <li><b>Opponent home/away and history.</b> In testing, what a defense allows at home vs. on the road helped only passing yards and completions, so only those models use it; cards show it as context for every stat. A player's own history against this opponent (usually 1–3 past games) added nothing for RB, WR or TE stats, so it's left out.</li>
      <li><b>Defense vs. position.</b> It helped a little on held-out games for rushing yards, rush attempts, passing yards and completions, so those models use it. For receiving yards, receptions, rush + rec yards and passing TDs it added nothing or made things worse, so those show it as context only. Early in the season it rests on only a few games per defense.</li>
      <li><b>Teammates out.</b> In past games, "out" meant a regular who didn't take a snap. On the board it means a player ESPN lists as Out, Doubtful, IR or suspended. The two mostly line up, but a surprise inactive on game day isn't caught. Share trend (last 3 games vs. season) and red zone touches didn't improve yardage predictions, so they're shown as context only.</li>
      <li><b>Hit history.</b> "Cleared in 6 of 8" is the player's own record this season. It's context, not a forecast: small samples swing a lot, and the tested rate already accounts for the player's averages.</li>
      <li><b>Not betting value.</b> These are likely outcomes, not prices. An 85% play can still be a bad bet at the posted odds.</li>
    </ul>
    <h3>Projected lines</h3>
    <div class="tablebox"><table class="data"><thead><tr><th class="t">Stat</th><th>Games</th><th>Avg miss</th><th>Season avg miss</th><th>Over</th><th>Under</th></tr></thead><tbody>
    ${Object.values(MARKETS).filter((m) => m.proj).map((m) => { const h = m.proj.heldOut; return `<tr><td class="t">${esc(m.label)}</td><td>${h.n}</td><td class="r">${num(h.mae)}</td><td>${num(h.maeAvg)}</td><td>${pct(h.over)}</td><td>${pct(h.under)}</td></tr>`; }).join("")}
    </tbody></table></div>
    <p class="hint">"Avg miss" is how far the projection landed from the real result, on average, in held-out games. "Season avg miss" is the same for just using the player's season average. Over and under don't add to 100% because some games land exactly on the projection, most often zero for a backup.</p>
    <div class="grid2">${Object.entries(MARKETS).map(([k, m]) => Object.entries(m.lines).map(([line, s]) => `
      <div class="panel"><h3>${esc(m.label)} ${line}+</h3>
      <span class="count">${s.heldOut.n} held-out games · ${pct(s.heldOut.base)} cleared it overall</span>
      <table class="data"><thead><tr><th class="t">Model says</th><th>Games</th><th>Hit</th><th>2025–26 only</th></tr></thead><tbody>
      ${[...s.tiers].reverse().map((t) => { const h = ["2025", "2026"].reduce((a, y) => t.bySeason[y] ? [a[0] + t.bySeason[y][0], a[1] + t.bySeason[y][1]] : a, [0, 0]);
        return `<tr><td class="t">${pct(t.min)}+</td><td>${t.n}</td><td class="r">${pct(t.hit)}</td><td>${h[1] ? `${pct(h[0] / h[1])} <span class="count">(${h[1]})</span>` : "–"}</td></tr>`; }).join("")}
      </tbody></table></div>`).join("")).join("")}</div>
  </div>`;
}

function render() {
  renderTabs();
  const built = new Date(DATA.builtAt);
  $("#sub").textContent = DATA.week ? `${DATA.season} Week ${DATA.week} · built ${built.toLocaleString([], { weekday: "short", hour: "numeric", minute: "2-digit" })}` : "No games scheduled";
  $("#view").innerHTML = { top: viewTop, stats: viewStats, defense: viewDefense, results: viewResults, backtest: viewBacktest }[state.tab]();
}
document.addEventListener("click", (e) => {
  const t = e.target.closest("[data-tab]");
  if (t) { state.tab = t.dataset.tab; render(); window.scrollTo(0, 0); return; }
  const s = e.target.closest("button[data-set]");
  if (s) {
    const v = s.dataset.val;
    state[s.dataset.set] = s.dataset.set === "min" ? +v : s.dataset.set === "all" ? v === "true" : v;
    if (s.dataset.set === "market") state.all = false;
    render();
  }
});
document.addEventListener("change", (e) => { if (e.target.matches("select[data-set]")) { state[e.target.dataset.set] = e.target.value; render(); } });
$("#update-btn").addEventListener("click", update);
render();
</script>
