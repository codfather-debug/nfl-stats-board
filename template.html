<title>NFL Stat Board</title>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700&family=Source+Sans+3:wght@400;600;700&display=swap">
<style>
/* A game-day call sheet: a band of tabs, then dense rows. Same look as the TD Board. */
:root {
  --bg: #eef1f4; --surface: #ffffff; --sunken: #e1e6ec; --fg: #14202b; --muted: #566573; --line: #ccd5de;
  --accent: #1d4f91; --accent-fg: #ffffff; --band: #13263d; --band-fg: #eaf0f7; --band-muted: #a7b9cc;
  --rb: #b5461f; --wr: #1c62a8; --te: #7a3f9d; --qb: #8a6a00;
  --good: #16764d; --bad: #b3362b; --warn: #a86a00;
  --display: "Barlow Condensed", "Arial Narrow", sans-serif;
  --body: "Source Sans 3", system-ui, sans-serif;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --bg: #0f1620; --surface: #17212d; --sunken: #0b1118; --fg: #e6edf4; --muted: #9daebf; --line: #2b3a4a;
  --accent: #7fb2f0; --accent-fg: #0a1420; --band: #0a1624; --band-fg: #e6edf4; --band-muted: #8ea4bb;
  --rb: #f08a5d; --wr: #6db1f0; --te: #c592e6; --qb: #e0bd4f;
  --good: #5fcb9b; --bad: #f0827a; --warn: #f0b84a; color-scheme: dark;
} }
:root[data-theme="dark"] {
  --bg: #0f1620; --surface: #17212d; --sunken: #0b1118; --fg: #e6edf4; --muted: #9daebf; --line: #2b3a4a;
  --accent: #7fb2f0; --accent-fg: #0a1420; --band: #0a1624; --band-fg: #e6edf4; --band-muted: #8ea4bb;
  --rb: #f08a5d; --wr: #6db1f0; --te: #c592e6; --qb: #e0bd4f;
  --good: #5fcb9b; --bad: #f0827a; --warn: #f0b84a; color-scheme: dark;
}
* { box-sizing: border-box; }
body { background: var(--bg); color: var(--fg); font: 15px/1.4 var(--body); margin: 0; font-variant-numeric: tabular-nums; }
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 10; background: var(--band); }
.gutter { padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
.wrap { max-width: 1120px; margin: 0 auto; }
header.top { background: var(--band); color: var(--band-fg); padding-block: calc(16px + env(safe-area-inset-top, 0px)) 0; }
.brand { display: flex; flex-wrap: wrap; align-items: baseline; gap: 4px 14px; }
h1 { font: 700 34px/1 var(--display); letter-spacing: .01em; margin: 0; text-transform: uppercase; }
.brand small { color: var(--band-muted); font-size: 13px; }
.updater { margin-left: auto; display: flex; flex-wrap: wrap; align-items: center; justify-content: flex-end; gap: 4px 10px; }
#update-status { color: var(--band-muted); font-size: 13px; }
#update-btn { background: var(--band-fg); color: var(--band); border: 0; border-radius: 5px; cursor: pointer; font: 700 15px/1 var(--display); letter-spacing: .03em; padding: 8px 11px; text-transform: uppercase; white-space: nowrap; }
#update-btn:disabled { cursor: wait; opacity: .6; }
nav.tabs { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 5; background: var(--band); }
.tabrow { display: flex; gap: 2px; overflow-x: auto; padding-top: 8px; }
.tabrow button { flex: none; background: none; border: 0; color: var(--band-muted); cursor: pointer; font: 600 18px/1 var(--display); letter-spacing: .03em; padding: 10px 14px 11px; text-transform: uppercase; border-radius: 4px 4px 0 0; }
.tabrow button:hover { color: var(--band-fg); }
.tabrow button[aria-selected="true"] { background: var(--bg); color: var(--fg); }
main { padding-block: 20px 48px; }
h2 { font: 700 24px/1.1 var(--display); letter-spacing: .02em; margin: 0; text-transform: uppercase; }
h3 { font: 600 18px/1.1 var(--display); letter-spacing: .03em; margin: 0; text-transform: uppercase; }
.stack { display: flex; flex-direction: column; gap: 18px; }
.hint { color: var(--muted); font-size: 13.5px; max-width: 75ch; margin: 4px 0 0; }
button, select { font: inherit; color: inherit; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.filters { display: flex; flex-wrap: wrap; gap: 8px 12px; align-items: center; }
.seg { display: inline-flex; flex-wrap: wrap; border: 1px solid var(--line); border-radius: 6px; overflow: hidden; background: var(--surface); }
.seg button { background: none; border: 0; border-right: 1px solid var(--line); cursor: pointer; padding: 6px 11px; font-size: 14px; font-weight: 600; color: var(--muted); }
.seg button:last-child { border-right: 0; }
.seg button[aria-pressed="true"] { background: var(--accent); color: var(--accent-fg); }
select { background: var(--surface); border: 1px solid var(--line); border-radius: 6px; padding: 5px 9px; max-width: 100%; }
.count { color: var(--muted); font-size: 13.5px; }
.chip { display: inline-block; font: 700 14px/1 var(--display); letter-spacing: .04em; color: var(--c); border: 1.5px solid var(--c); border-radius: 4px; padding: 3px 5px 2px; }
.RB { --c: var(--rb); } .WR { --c: var(--wr); } .TE { --c: var(--te); } .QB { --c: var(--qb); }
.flag { display: inline-block; font: 600 12px/1 var(--body); color: var(--warn); border: 1px solid currentColor; border-radius: 3px; padding: 2px 4px; margin-left: 4px; vertical-align: middle; }
.flag.bad { color: var(--bad); }

.cards { display: grid; grid-template-columns: repeat(auto-fill, minmax(250px, 1fr)); gap: 10px; }
.card { background: var(--surface); border: 1px solid var(--line); border-radius: 6px; padding: 10px 12px; display: grid; gap: 5px; }
.card .l1 { display: flex; justify-content: space-between; align-items: center; gap: 8px; color: var(--muted); font-size: 13.5px; }
.card .name { font: 600 21px/1.05 var(--display); }
.card .mile { display: flex; justify-content: space-between; align-items: baseline; gap: 8px; }
.card .mile span { font-weight: 600; }
.card .rate { font: 700 28px/1 var(--display); color: var(--good); }
.card .l3 { color: var(--muted); font-size: 13px; }
.card .l3 b { color: var(--fg); font-weight: 600; }
.meter { height: 6px; background: var(--sunken); border-radius: 3px; overflow: hidden; }
.meter i { display: block; height: 100%; background: var(--good); }
.day { display: flex; align-items: baseline; gap: 8px; margin: 6px 0 -6px; }
.day span { color: var(--muted); font-size: 13.5px; }

.tablebox { overflow-x: auto; background: var(--surface); border: 1px solid var(--line); border-radius: 6px; }
table.data { border-collapse: collapse; width: 100%; font-size: 14px; }
table.data th { background: var(--sunken); color: var(--muted); font-size: 12px; font-weight: 600; letter-spacing: .03em; padding: 7px 9px; text-align: right; white-space: nowrap; }
table.data td { padding: 6px 9px; border-top: 1px solid var(--line); text-align: right; white-space: nowrap; }
table.data .t { text-align: left; }
table.data td.who { font-weight: 600; white-space: normal; min-width: 150px; }
table.data td.who .count { font-weight: 400; font-size: 12.5px; }
td.r { font-weight: 700; }
td.r.h4 { color: var(--good); } td.r.h3 { color: color-mix(in srgb, var(--good) 75%, var(--fg)); } td.r.h1 { color: var(--muted); font-weight: 400; }
.hit { color: var(--good); font-weight: 700; } .miss { color: var(--bad); font-weight: 700; } .void { color: var(--muted); }
.grid2 { display: grid; grid-template-columns: repeat(auto-fit, minmax(min(100%, 340px), 1fr)); gap: 14px; }
.panel { background: var(--surface); border: 1px solid var(--line); border-radius: 6px; padding: 12px 14px; display: grid; gap: 10px; align-content: start; min-width: 0; }
.panel > * { min-width: 0; }
table.mt td.who { min-width: 104px; } table.mt td, table.mt th { padding: 5px 4px; } table.mt td.who .count { font-size: 12px; }
@media (max-width: 480px) { .panel { padding: 10px; } }
.panel table.data th { background: none; padding: 3px 6px; } .panel table.data td { padding: 4px 6px; }
.notes { background: var(--surface); border: 1px solid var(--line); border-radius: 6px; padding: 4px 16px; }
.notes li { margin: 8px 0; max-width: 80ch; }
@media (max-width: 480px) { table.data th, table.data td { padding: 6px 5px; } table.data td.who { min-width: 118px; } table.data td.who .chip { display: none; } }
.tablebox table.data th:first-child, .tablebox table.data td:first-child { position: sticky; left: 0; z-index: 1; background: var(--surface); box-shadow: 1px 0 0 var(--line); }
.tablebox table.data th:first-child { background: var(--sunken); }
.soft { color: var(--good); font-weight: 700; } .tough { color: var(--bad); font-weight: 700; }
.card .mu { font-size: 13px; color: var(--muted); }
table.data th button { all: unset; cursor: pointer; } table.data th[aria-sort] { color: var(--fg); }
tr.mine td { background: color-mix(in srgb, var(--accent) 10%, transparent); }
details.log summary { cursor: pointer; color: var(--accent); font-size: 13px; font-weight: 600; }
details.log table.data { margin-top: 6px; font-size: 13px; } details.log table.data th, details.log table.data td { padding: 3px 5px; }
.hh { display: block; font-size: 11.5px; font-weight: 400; color: var(--muted); }
.more { justify-self: start; background: none; border: 0; padding: 0; color: var(--accent); cursor: pointer; font-weight: 600; text-decoration: underline; text-underline-offset: 2px; }
</style>
<header class="top gutter">
  <div class="wrap">
    <div class="brand">
      <h1>NFL Stat Board</h1>
      <small id="sub"></small>
      <div class="updater"><span id="update-status" aria-live="polite"></span><button id="update-btn" type="button">Update injuries</button></div>
    </div>
  </div>
</header>
<nav class="tabs gutter"><div class="wrap tabrow" role="tablist" id="tabs"></div></nav>
<main class="gutter"><div class="wrap" id="view"></div></main>
<script>
const DATA = /*__DATA__*/null;
const MODEL = DATA.model, MARKETS = MODEL.markets;
for (const p of DATA.players) if (Array.isArray(p.x)) p.x = Object.fromEntries(DATA.xCols.map((k, i) => [k, p.x[i]]));
const UNAVAILABLE = new Set(["Out", "Doubtful", "Injured Reserve", "Suspension"]);
const TEAMS = { // Keep in step with TEAMS in build.py.
  Cardinals: "ARI", Falcons: "ATL", Ravens: "BAL", Bills: "BUF", Panthers: "CAR", Bears: "CHI", Bengals: "CIN", Browns: "CLE",
  Cowboys: "DAL", Broncos: "DEN", Lions: "DET", Packers: "GB", Texans: "HOU", Colts: "IND", Jaguars: "JAX", Chiefs: "KC",
  Rams: "LA", Chargers: "LAC", Raiders: "LV", Dolphins: "MIA", Vikings: "MIN", Patriots: "NE", Saints: "NO", Giants: "NYG",
  Jets: "NYJ", Eagles: "PHI", Steelers: "PIT", Seahawks: "SEA", "49ers": "SF", Buccaneers: "TB", Titans: "TEN", Commanders: "WAS" };
const STAT_SHORT = { rush_yds: "rush yds", carries: "carries", rec_yds: "rec yds", receptions: "rec", scrimmage: "rush+rec yds",
  td: "TD", long_rush: "yd long rush", long_rec: "yd long catch", pass_yds: "pass yds", pass_tds: "pass TD", completions: "comp" };
const LOG = Object.fromEntries((DATA.logCols || []).map((c, i) => [c, i])); // Keep in step with LOG in build.py.
function logStat(row, stat) { return stat === "scrimmage_yards" ? row[LOG.rushing_yards] + row[LOG.receiving_yards] : row[LOG[stat]]; }
function history(p, stat, line) {
  const vals = p.log.map((r) => logStat(r, stat)), l5 = vals.slice(-5);
  return { hits: vals.filter((v) => v >= line).length, games: vals.length, hits5: l5.filter((v) => v >= line).length, games5: l5.length };
}
const mileText = (mk, line) => mk === "td" ? "Anytime TD" : `${MARKETS[mk].label} ${line}+`;
const state = { tab: "top", mgame: "", min: 0.7, market: "rush_yds", game: "", all: false, dpos: "RB", dsort: "" };
const DEF = Object.fromEntries((DATA.defenses || []).map((d) => [`${d.team}|${d.pos}`, d]));
const DEF_COLS = { QB: ["passing_yards", "passing_tds", "completions", "attempts", "rushing_yards"],
  RB: ["rushing_yards", "carries", "scrimmage_yards", "tshare", "receptions", "receiving_yards", "rr_tds"],
  WR: ["targets", "tshare", "receptions", "receiving_yards", "rr_tds"], TE: ["targets", "tshare", "receptions", "receiving_yards", "rr_tds"] };
const COL_LABEL = { passing_yards: "Pass yds", passing_tds: "Pass TD", completions: "Comp", attempts: "Att", rushing_yards: "Rush yds",
  carries: "Carries", scrimmage_yards: "Rush+rec", receptions: "Rec", receiving_yards: "Rec yds", targets: "Targets", rr_tds: "TDs", tshare: "Tgt share" };
const ord = (n) => n + (n % 100 >= 11 && n % 100 <= 13 ? "th" : ["th", "st", "nd", "rd"][n % 10] || "th");
const rankClass = (r) => r <= 8 ? "soft" : r >= 25 ? "tough" : "";
function matchup(p, stat) { const d = DEF[`${p.opp}|${p.pos}`]; return d && d[stat] ? { v: d[stat][0], lg: d[stat][1], rank: d[stat][2], games: d.games } : null; }
const $ = (s) => document.querySelector(s);
const esc = (s) => String(s ?? "").replace(/[&<>"]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
const pct = (v) => v == null ? "–" : Math.round(v * 100) + "%";
const num = (v, d = 1) => v == null ? "–" : (+v).toFixed(d);

function normName(name) { // Keep in step with norm_name in features.py.
  return String(name).normalize("NFKD").replace(/[̀-ͯ]/g, "").toLowerCase()
    .replace(/[.'’\-]/g, "").trim().replace(/\s+(jr|sr|ii|iii|iv|v)$/, "").replace(/\s+/g, " ");
}
const surname = (k) => k.split(" ").pop();
function predict(coef, x) { // Keep in step with predict in build.py.
  let z = coef.intercept;
  for (const [k, c] of Object.entries(coef)) if (k !== "intercept") z += c * (x[k] || 0);
  return 1 / (1 + Math.exp(-z));
}
const tierFor = (tiers, p) => tiers.filter((t) => p >= t.min).pop();

function project(coef, x) { // Keep in step with project in build.py.
  let z = coef.intercept;
  for (const [k, c] of Object.entries(coef)) if (k !== "intercept") z += c * (x[k] || 0);
  return Math.max(0, z);
}
function rescore() {
  for (const p of DATA.players) {
    for (const k of Object.keys(p.plays)) {
      const [mk, line] = k.split("|"), spec = MARKETS[mk].lines[line], prob = predict(spec.coef, p.x);
      p.plays[k] = { p: prob, rate: tierFor(spec.tiers, prob).hit };
    }
    for (const mk of Object.keys(p.proj)) p.proj[mk] = project(MARKETS[mk].proj.coef, p.x);
  }
}
function parseInjuries(json) { // Keep in step with injuries in build.py.
  const latest = {};
  for (const team of json.injuries || []) {
    const abbr = Object.entries(TEAMS).find(([n]) => (team.displayName || "").endsWith(n))?.[1];
    for (const item of team.injuries || []) {
      const key = `${abbr}|${normName(item.athlete.displayName)}`;
      if (!latest[key] || (item.date || "") > latest[key][0]) latest[key] = [item.date || "", item.status || ""];
    }
  }
  return Object.fromEntries(Object.entries(latest).map(([k, v]) => [k, v[1]]));
}
function statusFor(team, key, inj, teammates) { // Keep in step with status_for in build.py.
  if (inj[`${team}|${key}`] !== undefined) return inj[`${team}|${key}`];
  const listed = Object.keys(inj).filter((k) => k.startsWith(team + "|") && surname(k.split("|")[1]) === surname(key));
  if (listed.length === 1 && teammates.filter((t) => surname(t) === surname(key)).length === 1) return inj[listed[0]];
  return "";
}
async function update() {
  const btn = $("#update-btn"), status = $("#update-status");
  btn.disabled = true; status.textContent = "Updating…";
  const done = [];
  try {
    const inj = parseInjuries(await (await fetch("https://site.api.espn.com/apis/site/v2/sports/football/nfl/injuries")).json());
    const roster = {};
    for (const p of DATA.players) (roster[p.team] ||= []).push(p.key);
    let changed = 0;
    for (const p of DATA.players) {
      const s = statusFor(p.team, p.key, inj, roster[p.team]);
      if (s === p.status) continue;
      changed++;
      // A regular newly ruled out (or back) frees (or takes back) a share of carries and targets for teammates.
      const flip = UNAVAILABLE.has(s) - UNAVAILABLE.has(p.status);
      if (flip && p.regular) for (const q of DATA.players) if (q.team === p.team && q !== p) {
        q.x.vac_carries = Math.min(1, Math.max(0, (q.x.vac_carries || 0) + flip * (p.x.carries_sh || 0)));
        q.x.vac_targets = Math.min(1, Math.max(0, (q.x.vac_targets || 0) + flip * (p.x.targets_sh || 0)));
      }
      p.status = s;
    }
    rescore();
    done.push(`${changed} injury change${changed === 1 ? "" : "s"}`);
  } catch (e) { done.push("injuries unavailable"); }
  status.textContent = `Updated ${new Date().toLocaleTimeString([], { hour: "numeric", minute: "2-digit" })}: ${done.join(", ")}`;
  btn.disabled = false;
  render();
}

const kickTime = (iso) => new Date(iso);
const dayLabel = (d) => d.toLocaleDateString([], { weekday: "long", month: "short", day: "numeric" });
const timeLabel = (d) => d.toLocaleTimeString([], { hour: "numeric", minute: "2-digit" });
const gameOf = (team) => DATA.slate.find((g) => g.team === team);
const started = (team) => { const g = gameOf(team); return g.final || kickTime(g.kickoff) <= new Date(); };
const mileLabel = (mk, line) => mk === "td" ? "Anytime TD" : `${line}+ ${STAT_SHORT[mk]}`;
const statusFlag = (s) => !s || s === "Active" ? "" : `<span class="flag${UNAVAILABLE.has(s) ? " bad" : ""}">${esc(s === "Injured Reserve" ? "IR" : s)}</span>`;
const available = (p) => !UNAVAILABLE.has(p.status);

function tierInfo(mk, line, prob) { return tierFor(MARKETS[mk].lines[line].tiers, prob); }
const PERFECT = 1, PERFECT_MIN_GAMES = 3, PERFECT_MIN_RATE = 0.6;
function bestPlays(min) {
  // One card per player and stat: the highest milestone whose tested rate clears `min`.
  // The 100% filter instead keeps milestones the player has cleared in every game this season
  // (3+ games) that also tested at 60%+.
  const out = [];
  for (const p of DATA.players) {
    if (!available(p) || started(p.team)) continue;
    const best = {};
    for (const [k, v] of Object.entries(p.plays)) {
      const [mk, line] = k.split("|");
      let ok = v.rate >= min;
      if (min === PERFECT) {
        const h = history(p, MARKETS[mk].stat, +line);
        ok = v.rate >= PERFECT_MIN_RATE && h.games >= PERFECT_MIN_GAMES && h.hits === h.games;
      }
      if (ok && (!best[mk] || +line > best[mk].line)) best[mk] = { mk, line: +line, ...v };
    }
    for (const b of Object.values(best)) out.push({ pl: p, ...b });
  }
  return out.sort((a, b) => b.rate - a.rate || b.p - a.p);
}

const TABS = [["top", "Top plays"], ["matchup", "Matchups"], ["stats", "By stat"], ["defense", "Defenses"], ["results", "Results"], ["backtest", "How tested"]];
function renderTabs() {
  $("#tabs").innerHTML = TABS.map(([k, l]) => `<button role="tab" aria-selected="${state.tab === k}" data-tab="${k}">${l}</button>`).join("");
}
function seg(name, opts, cur) {
  return `<div class="seg" role="group">${opts.map(([v, l]) => `<button type="button" data-set="${name}" data-val="${v}" aria-pressed="${String(v) === String(cur)}">${l}</button>`).join("")}</div>`;
}

function viewTop() {
  const plays = bestPlays(state.min);
  const byDay = {};
  for (const x of plays) {
    const g = gameOf(x.pl.team), d = dayLabel(kickTime(g.kickoff));
    (byDay[d] ||= []).push(x);
  }
  const days = Object.keys(byDay).sort((a, b) => kickTime(gameOf(byDay[a][0].pl.team).kickoff) - kickTime(gameOf(byDay[b][0].pl.team).kickoff));
  return `<div class="stack">
    <div><h2>Week ${DATA.week} top plays</h2>
    <p class="hint">Each card is the highest milestone for that player and stat that cleared the bar in testing. The big number is how often players in that model tier actually got there in seasons the model never trained on. It isn't the model's raw output. Out, Doubtful and IR players are removed, and games that have kicked off drop off.</p></div>
    <div class="filters">${seg("min", [[PERFECT, "100% so far"], [0.8, "80%+"], [0.7, "70%+"], [0.6, "60%+"]], state.min)}<span class="count">${plays.length} plays</span></div>
    ${state.min === PERFECT ? `<p class="hint">100% so far: milestones the player has cleared in every game this season (${PERFECT_MIN_GAMES}+ games) that also tested at ${pct(PERFECT_MIN_RATE)} or better. The big number is the player's record, like 7/7. Under it is the tested rate: how often players in that model tier actually got there, which is the better guide to the real chance. No milestone tests at 100%.</p>` : ""}
    ${days.length ? days.map((d) => `<div class="day"><h3>${esc(d)}</h3></div><div class="cards">${byDay[d].map(card).join("")}</div>`).join("")
      : `<p class="hint">No upcoming plays at this level. Try a lower bar, or check back when next week's lines post.</p>`}
  </div>`;
}
function card(x) {
  const p = x.pl, m = MARKETS[x.mk], g = gameOf(p.team), t = tierInfo(x.mk, x.line, x.p);
  return `<div class="card">
    <div class="l1"><span><span class="chip ${p.pos}">${p.pos}</span> ${esc(p.team)} ${g.home ? "vs" : "@"} ${esc(p.opp)} · ${timeLabel(kickTime(g.kickoff))}</span><span>${statusFlag(p.status)}</span></div>
    <div class="name">${esc(p.player)}</div>
    ${state.min === PERFECT ? (() => { const h = history(p, m.stat, x.line);
      return `<div class="mile"><span>${esc(mileText(x.mk, x.line))}</span><span class="rate">${h.hits}/${h.games}</span></div>

const PROJ_UNIT = { rush_yds: "rush yds", carries: "carries", rec_yds: "rec yds", receptions: "rec", scrimmage: "rush+rec yds",
  long_rush: "yd long rush", long_rec: "yd long catch", pass_yds: "pass yds", pass_tds: "pass TD", completions: "comp" };
const projText = (p, mk) => p.proj[mk] == null ? "" : `Projected <b>${num(p.proj[mk])}</b> ${PROJ_UNIT[mk]} · `;
// Home/away, indoors/outdoors and turf/grass averages from the game log.
const SPLIT_DEFS = [["home", "Home", "Away"], ["indoor", "Indoors", "Outdoors"], ["turf", "Turf", "Grass"]];

    return `${here ? yes : no} <b>${num(a.avg)}</b> <span class="count">(${a.n}g)</span> vs ${(here ? no : yes).toLowerCase()} ${num(b.avg)} <span class="count">(${b.n}g)</span>`;
  });

}
function histLine(p, m, line) {

const RECEIVING = new Set(["rec_yds", "receptions", "long_rec"]), PASSING = new Set(["pass_yds", "pass_tds", "completions"]);

  const showC = !RECEIVING.has(mk) && (p.pos === "RB" || p.pos === "QB");
  if (showC) bits.push(`Carry share <b>${pct(x.carries_sh)}</b> (last 3: ${pct(x.carries_sh3)}${trend(x.carries_sh3, x.carries_sh)})`);

const LOG_SHOW = { rush: ["carries", "rushing_yards", "long_rush", "rr_tds"], rec: ["targets", "receptions", "receiving_yards", "long_rec", "rr_tds"],

const TIER_LABEL = { soft: "soft (1st–10th)", mid: "middle (11th–22nd)", tough: "tough (23rd–32nd)" };

const BUCKETS = [[0.8, 1.01, "80%+"], [0.7, 0.8, "70–79%"], [0.6, 0.7, "60–69%"], [0.5, 0.6, "50–59%"]];

  return { n: g.length, hits, rate: g.length ? hits / g.length : null, exp: g.length ? g.reduce((s, e) => s + e.rate, 0) / g.length : null };
}
function viewResults() {
  const all = DATA.results, graded = all.filter((e) => e.hit != null);
  const pending = all.filter((e) => !("actual" in e)).length, voids = all.filter((e) => "actual" in e && e.hit == null).length;

      <div class="panel"><h3>By stat</h3><table class="data">${head}<tbody>${Object.entries(MARKETS).map(([k, m]) => row(m.label, graded.filter((e) => e.market === k))).join("")}</tbody></table></div>
      <div class="panel"><h3>By week</h3><table class="data">${head}<tbody>${weeks.map((w) => row(`Week ${w % 100}`, graded.filter((e) => e.season * 100 + e.week === w))).join("") || '<tr><td class="t" colspan="5">No graded games yet.</td></tr>'}</tbody></table></div>

    </tbody></table></div>
  </div>`;

// Starters: the most-used available players at each spot, by snap share over the last 3 games
// (season, then last game, as fallbacks). Running backs go by share of carries plus targets, so a
// fullback who plays a lot of snaps doesn't count as the RB2.
const STARTERS = { QB: 1, RB: 2, WR: 3, TE: 1 };
const GROUPS = [
  ["QB", ["QB"], [["pass_yds", "Pass yds"], ["completions", "Comp"], ["pass_tds", "Pass TD"], ["rush_yds", "Rush yds"]]],
  ["RB", ["RB"], [["rush_yds", "Rush yds"], ["carries", "Car"], ["receptions", "Rec"], ["scrimmage", "Rush+rec"], ["td", "TD"]]],
  ["WR / TE", ["WR", "TE"], [["receptions", "Rec"], ["rec_yds", "Rec yds"], ["long_rec", "Long"], ["td", "TD"]]],
];
const GROUP_DEF = { QB: [["passing_yards", "pass yds"], ["rushing_yards", "rush yds"]], RB: [["rushing_yards", "rush yds"], ["receiving_yards", "rec yds"]],
  WR: [["receiving_yards", "rec yds"], ["receptions", "rec"]], TE: [["receiving_yards", "rec yds"], ["receptions", "rec"]] };
const usage = (p) => p.x.snap_l3 ?? p.x.snap_g ?? p.x.snap_last ?? 0;

function starters(team) {
  const mine = DATA.players.filter((p) => p.team === team && Object.keys(p.plays).length);
  const out = [], hurt = [];
  for (const [pos, n] of Object.entries(STARTERS)) {
    const at = mine.filter((p) => p.pos === pos).sort((a, b) => rank(b) - rank(a));
    // Past the top spot, list only players with a real role.
    const ok = at.filter(available).filter((p, i) => i === 0 || rank(p) >= (pos === "RB" ? 0.08 : 0.25));
    out.push(...ok.slice(0, n));
    // Would-be starters ruled out, so it's clear who's missing.
    hurt.push(...at.filter((p) => !available(p) && rank(p) >= rank(ok[n - 1] || { pos, x: {} })));
  }
  return { out, hurt };
}
// Share of team targets (and carries for backs) this season, with the last-3 trend arrow.
function shareText(p) {
  const x = p.x, bits = [];
  if (p.pos === "RB") bits.push(`${pct(x.carries_sh)} car${trend(x.carries_sh3, x.carries_sh)}`);
  if (p.pos !== "QB") bits.push(`${pct(x.targets_sh)} tgt${trend(x.targets_sh3, x.targets_sh)}`);
  return bits.join(" · ");
}
function bestOf(p) {

    const [mk, line] = k.split("|");

  }
  return best;
}

  return `<td><b>${num(p.proj[mk])}</b><span class="hh">avg ${num(p.x[m.stat + "_g"] ?? p.x["prev_" + m.stat])}</span></td>`;
}
function teamPanel(team, opp) {

    ${hurt.length ? `<div class="mu"><span class="flag bad">Out</span> ${hurt.map((p) => `${esc(p.player)} (${p.pos}${p.status === "Doubtful" ? ", doubtful" : ""})`).join(", ")}</div>` : ""}
    ${GROUPS.map(([label, poss, cols]) => {

        return `${pos}s: ${GROUP_DEF[pos].map(([c, l]) => `<span class="${rankClass(d[c][2])}">${ord(d[c][2])}</span> ${l}`).join(", ")}${ts}`; }).filter(Boolean).join(" · ");

      </tbody></table></div></div>`;

}
function viewMatchup() {

function viewDefense() {
  const pos = state.dpos, cols = DEF_COLS[pos], sort = cols.includes(state.dsort) ? state.dsort : cols[0];
  const rows = (DATA.defenses || []).filter((d) => d.pos === pos).sort((a, b) => (a[sort]?.[2] ?? 99) - (b[sort]?.[2] ?? 99));
  const opp = Object.fromEntries(DATA.slate.map((g) => [g.opp, g.team]));
  return `<div class="stack">
    <div><h2>Defense vs. position</h2><p class="hint">Per game allowed to each position this season, through Week ${DATA.week - 1}. Ranks run from 1st (allows the most, the softest matchup) to 32nd. Green is a top-8 soft matchup and red is a bottom-8 tough one. Tap a column to sort. Rows for defenses facing a team this week show the opponent.</p></div>
    <div class="filters">${seg("dpos", ["QB", "RB", "WR", "TE"].map((p) => [p, p + "s"]), pos)}</div>
    <div class="tablebox"><table class="data"><thead><tr><th class="t">Defense</th><th class="t">Faces</th>${cols.map((c) => `<th${c === sort ? ' aria-sort="descending"' : ""}><button data-set="dsort" data-val="${c}">${COL_LABEL[c]}</button></th>`).join("")}</tr></thead><tbody>
    ${rows.map((d) => `<tr><td class="t who">${esc(d.team)} <span class="count">${d.games}g</span></td><td class="t">${opp[d.team] ? esc(opp[d.team]) : '<span class="count">bye</span>'}</td>${cols.map((c) => d[c] ? `<td>${c === "tshare" ? pct(d[c][0]) : num(d[c][0])} <span class="${rankClass(d[c][2]) || "count"}">${ord(d[c][2])}</span></td>` : "<td>–</td>").join("")}</tr>`).join("")}
    </tbody></table></div>
    <p class="hint">League average: ${cols.map((c) => `${COL_LABEL[c]} ${c === "tshare" ? pct(rows[0]?.[c]?.[1]) : num(rows[0]?.[c]?.[1])}`).join(" · ")}. Tgt share is the share of all passes thrown against that defense that went to ${pos}s.</p>
  </div>`;
}

function viewBacktest() {
  return `<div class="stack">
    <div><h2>How it was tested</h2><p class="hint">One logistic model per milestone, trained on ${MODEL.seasons[0]}–${MODEL.seasons[MODEL.seasons.length - 1]}. Inputs are the player's per-game average for the stat (blended with last season's, which counts like 3 games, so early weeks and players back from injury still have a baseline), last-3 average, volume (carries, targets or pass attempts) and share of team volume, snap share in the player's last game, games played this season and games missed since last playing. Rushing yards, rush attempts, receptions, rush + rec, passing yards and completions also use the opponent's allowed-per-game to the player's position, compared with the league average; passing yards and completions also use what the opponent allows at home or on the road, matching this game. Rushing, receiving, receptions, rush + rec and longest catch also use the share of team carries or targets held by teammates who are out. Anytime TD uses red zone and inside-10 touches and shares. Longest rush and longest catch come from play-by-play. Only games before the one being predicted count. Each season from 2022 on is graded by a model trained only on the seasons before it, starting from 2020, so every rate comes from games the model never saw. Inputs were chosen on 2022–24, so the 2025–26 column is the cleanest check. Tiers with fewer than ${40} games are merged with the tier below. Each stat also has a projected line: a median model on the same inputs, so the player should finish above it about half the time.</p></div>
    <ul class="notes">
      <li><b>Raw model output runs high.</b> In the top tier the model's own probability ran several points above what actually happened, mostly for receiving stats. So the board shows tested tier rates, not raw output.</li>
      <li><b>Sample size.</b> Each held-out tier rests on 40 to over a thousand games. QB stats rest on ${MARKETS.pass_yds.lines["225"].heldOut.n} QB-games, so their tiers carry more noise (roughly ±7 points at 150 games).</li>
      <li><b>Chosen after seeing data.</b> The milestones, tier edges and inputs were picked while looking at past seasons. New inputs were chosen on 2022–24 only, so the 2025–26 column is the fairest check; the forward Results page is the honest one.</li>
      <li><b>Player stats only.</b> Projected team points and the spread are left out on purpose. Without them, the best held-out tier for RB, WR and TE stats dropped 1 to 3 points. For passing yards and passing TDs it dropped about 10 points, so QB plays are weaker than they could be.</li>
      <li><b>Splits.</b> Home vs. away, indoors vs. outdoors and turf vs. grass are shown on each card. In testing, adding a player's own splits didn't improve any stat (each split rests on just a few games), so the models don't use them.</li>
      <li><b>Players.</b> A player needs ${MODEL.minGames}+ games this season or ${MODEL.minPrevGames}+ last season, and must be on nflverse's active roster (IR and practice squad are left off). A traded player shows with the new team using numbers from the old one. A backup QB stepping in has little to go on, and receivers aren't adjusted when their starting QB is out.</li>
      <li><b>Strength of schedule.</b> Each card shows how soft or tough the defenses a player has faced were, and a schedule-adjusted average (each game scaled by how much that defense allows to the position). The adjusted average helped a little for rush attempts, receiving yards, receptions and rush + rec, so those models use it. A player's average against similar-rank defenses (soft, middle, tough) is shown too, but it added nothing in testing (each bucket has only 1 to 4 games), so the projections don't use it.</li>
      <li><b>Defense target share.</b> The share of a defense's targets that go to each position is shown on Matchups, the Defenses tab and receiving cards. In testing it added nothing to receiving yards, receptions, rush + rec, longest catch or anytime TD, even scaled by the player's own target share, so the models don't use it.</li>
      <li><b>Opponent home/away and history.</b> In testing, what a defense allows at home vs. on the road helped only passing yards and completions, so only those models use it; cards show it as context for every stat. A player's own history against this opponent (usually 1–3 past games) added nothing for RB, WR or TE stats, so it's left out.</li>
      <li><b>Defense vs. position.</b> It helped a little on held-out games for rushing yards, rush attempts, passing yards and completions, so those models use it. For receiving yards, receptions, rush + rec yards and passing TDs it added nothing or made things worse, so those show it as context only. Early in the season it rests on only a few games per defense.</li>
      <li><b>Teammates out.</b> In past games, "out" meant a regular who didn't take a snap. On the board it means a player ESPN lists as Out, Doubtful, IR or suspended. The two mostly line up, but a surprise inactive on game day isn't caught. Share trend (last 3 games vs. season) and red zone touches didn't improve yardage predictions, so they're shown as context only.</li>
      <li><b>Hit history.</b> "Cleared in 6 of 8" is the player's own record this season. It's context, not a forecast: small samples swing a lot, and the tested rate already accounts for the player's averages.</li>
      <li><b>Not betting value.</b> These are likely outcomes, not prices. An 85% play can still be a bad bet at the posted odds.</li>
    </ul>
    <h3>Projected lines</h3>
    <div class="tablebox"><table class="data"><thead><tr><th class="t">Stat</th><th>Games</th><th>Avg miss</th><th>Season avg miss</th><th>Over</th><th>Under</th></tr></thead><tbody>
    ${Object.values(MARKETS).filter((m) => m.proj).map((m) => { const h = m.proj.heldOut; return `<tr><td class="t">${esc(m.label)}</td><td>${h.n}</td><td class="r">${num(h.mae)}</td><td>${num(h.maeAvg)}</td><td>${pct(h.over)}</td><td>${pct(h.under)}</td></tr>`; }).join("")}
    </tbody></table></div>
    <p class="hint">"Avg miss" is how far the projection landed from the real result, on average, in held-out games. "Season avg miss" is the same for just using the player's season average. Over and under don't add to 100% because some games land exactly on the projection, most often zero for a backup.</p>
    <div class="grid2">${Object.entries(MARKETS).map(([k, m]) => Object.entries(m.lines).map(([line, s]) => `
      <div class="panel"><h3>${esc(m.label)} ${line}+</h3>
      <span class="count">${s.heldOut.n} held-out games · ${pct(s.heldOut.base)} cleared it overall</span>
      <table class="data"><thead><tr><th class="t">Model says</th><th>Games</th><th>Hit</th><th>2025–26 only</th></tr></thead><tbody>
      ${[...s.tiers].reverse().map((t) => { const h = ["2025", "2026"].reduce((a, y) => t.bySeason[y] ? [a[0] + t.bySeason[y][0], a[1] + t.bySeason[y][1]] : a, [0, 0]);
        return `<tr><td class="t">${pct(t.min)}+</td><td>${t.n}</td><td class="r">${pct(t.hit)}</td><td>${h[1] ? `${pct(h[0] / h[1])} <span class="count">(${h[1]})</span>` : "–"}</td></tr>`; }).join("")}
      </tbody></table></div>`).join("")).join("")}</div>
  </div>`;
}

function render() {
  renderTabs();
  const built = new Date(DATA.builtAt);
  $("#sub").textContent = DATA.week ? `${DATA.season} Week ${DATA.week} · built ${built.toLocaleString([], { weekday: "short", hour: "numeric", minute: "2-digit" })}` : "No games scheduled";
  $("#view").innerHTML = { top: viewTop, matchup: viewMatchup, stats: viewStats, defense: viewDefense, results: viewResults, backtest: viewBacktest }[state.tab]();
}
document.addEventListener("click", (e) => {
  const t = e.target.closest("[data-tab]");
  if (t) { state.tab = t.dataset.tab; render(); window.scrollTo(0, 0); return; }
  const s = e.target.closest("button[data-set]");
  if (s) {
    const v = s.dataset.val;
    state[s.dataset.set] = s.dataset.set === "min" ? +v : s.dataset.set === "all" ? v === "true" : v;
    if (s.dataset.set === "market") state.all = false;
    render();
  }
});
document.addEventListener("change", (e) => { if (e.target.matches("select[data-set]")) { state[e.target.dataset.set] = e.target.value; render(); } });
$("#update-btn").addEventListener("click", update);
render();
</script>
